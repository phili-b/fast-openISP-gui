site_name: fast-openISP
site_description: A fast software image signal processor with a desktop GUI
site_author: Philippe Baetens
copyright: "Philippe Baetens · based on fast-openISP by Qiu Jueqin (MIT) and openISP"
site_url: https://fiepfiep.github.io/fast-openISP-gui/
repo_url: https://github.com/fiepfiep/fast-openISP-gui
edit_uri: ""

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - ISP blocks explained: isp-blocks.md
  - User guide:
      - The GUI: gui.md
      - Color calibration: calibration.md
      - Input formats: inputs.md
      - Configuration files: configuration.md
      - Module reference: modules.md
      - Command line: cli.md
  - Development:
      - Developer guide: development.md
      - Building the Windows exe: building.md
      - API reference: api.md
  - Release notes: release-notes.md

hooks:
  - docs/hooks.py

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.keys
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            members_order: source
            docstring_style: sphinx
