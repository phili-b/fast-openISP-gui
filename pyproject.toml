[project]
name = "fast-openisp"
version = "0.3.0"
description = "Fast software ISP (image signal processor) in Python, with a desktop GUI"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Philippe Baetens" }]
dependencies = [
    "numpy>=2.2",
    "opencv-python-headless>=5.0",
    "pydantic>=2.9",
    "pyside6-essentials>=6.8",
    "pyyaml>=6.0",
    "rawpy>=0.24",
    "tifffile>=2024.8",
]

[project.scripts]
fast-openisp = "fast_openisp.cli:main"

[project.gui-scripts]
fast-openisp-gui = "fast_openisp.gui.app:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.11",
    "pytest>=8.3",
    "pytest-qt>=4.4",
    "ruff>=0.8",
    "ty>=0.0.1a30",
]
docs = [
    "mkdocs>=1.6,<2",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fast_openisp"]

[tool.uv]
default-groups = ["dev", "docs"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY", "PTH", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]  # allow × and similar symbols in strings/comments

[tool.ty.environment]
python-version = "3.13"

[tool.ty.src]
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
